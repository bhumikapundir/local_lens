services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: local_lens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: local_lens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_lens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
